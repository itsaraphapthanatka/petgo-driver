# Test-only CI for the Expo app: install from the lockfile, typecheck, verify
# th/en i18n key parity and the Google Directions refetch-throttle rules (pure
# functions + source tripwires, no network). Nothing here builds a binary or deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tsc + i18n parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node 24 (npm cache keyed on package-lock.json)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      - name: i18n th/en key parity
        run: node scripts/check-i18n-parity.mjs

      # Imports services/googleDirectionsApi.ts directly (Node 24 type stripping); --no-warnings
      # only silences the MODULE_TYPELESS_PACKAGE_JSON reparse notice, not any check.
      - name: Route throttle regression (offline)
        run: node --no-warnings scripts/check-route-throttle.mjs
